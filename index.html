<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>과일 베기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1810; }
  body { font-family: 'Noto Sans KR', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; cursor: crosshair; }

  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 22px; pointer-events: none; }
  .score { font-family: 'Black Han Sans', sans-serif; font-size: 44px; line-height: 1; color: #ffd84a; text-shadow: 0 3px 0 #a3480f, 0 6px 14px rgba(0,0,0,.5); }
  .best { font-size: 14px; color: #f4e3c8; opacity: .8; margin-top: 6px; }
  .lives { display: flex; gap: 6px; font-family: 'Black Han Sans', sans-serif; font-size: 34px; }
  .lives span { color: rgba(255,255,255,.25); transition: color .2s, transform .2s; }
  .lives span.lost { color: #ff3b30; transform: scale(1.15); text-shadow: 0 0 12px rgba(255,59,48,.7); }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,.7)); text-align: center; padding: 24px; }
  .overlay.hidden { display: none; }
  .title { font-family: 'Black Han Sans', sans-serif; font-size: clamp(54px, 11vw, 110px); line-height: 1; color: #ffd84a; text-shadow: 0 5px 0 #a3480f, 0 10px 30px rgba(0,0,0,.6); letter-spacing: 2px; }
  .sub { font-size: 17px; color: #f4e3c8; line-height: 1.7; }
  .sub b { color: #ffd84a; }
  .sub .bad { color: #ff6b5e; }
  .btn { pointer-events: auto; font-family: 'Black Han Sans', sans-serif; font-size: 28px; padding: 14px 44px; border: none; border-radius: 999px; background: linear-gradient(#ffcf3a, #ff8a1f); color: #5a2306; box-shadow: 0 6px 0 #a3480f, 0 12px 24px rgba(0,0,0,.4); cursor: pointer; transition: transform .1s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a3480f; }
  .final { font-family: 'Black Han Sans', sans-serif; font-size: 72px; color: #fff; text-shadow: 0 4px 0 #a3480f; }
  .newbest { color: #7dff9a; font-weight: 700; font-size: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="best" id="bestHud">최고 0</div>
  </div>
  <div class="lives" id="lives"><span>✕</span><span>✕</span><span>✕</span></div>
</div>

<div class="overlay" id="menu">
  <div class="title">과일 베기</div>
  <div class="sub">
    마우스를 <b>누른 채로 드래그</b>해서 떠오르는 과일을 베세요 (터치도 돼요)<br>
    한 번에 3개 이상 베면 <b>콤보 보너스</b><br>
    <span class="bad">💣 폭탄을 베면 −10점</span> · 과일을 3개 놓치면 게임 오버
  </div>
  <button class="btn" id="startBtn">시작</button>
</div>

<div class="overlay hidden" id="over">
  <div class="title" style="font-size:clamp(44px,8vw,80px)">게임 오버</div>
  <div class="final" id="finalScore">0</div>
  <div class="newbest" id="newBest"></div>
  <button class="btn" id="againBtn">다시 하기</button>
</div>

<script>
// ---------- 기본 설정 ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const FRUITS = [
  { e: '🍉', c: '#ff3b4f' }, { e: '🍊', c: '#ff9f1c' }, { e: '🍎', c: '#ff4d4d' },
  { e: '🍋', c: '#ffe14d' }, { e: '🍇', c: '#a64dff' }, { e: '🍓', c: '#ff2d55' },
  { e: '🍑', c: '#ffb08a' }, { e: '🍍', c: '#ffd23f' }, { e: '🥝', c: '#8fd14f' },
  { e: '🍐', c: '#d4e86a' }, { e: '🥭', c: '#ffb627' }
];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// 이모지를 미리 오프스크린 캔버스에 그려 둠 (매 프레임 텍스트 렌더링 방지)
const spriteCache = {};
function sprite(e) {
  if (spriteCache[e]) return spriteCache[e];
  const s = 160, oc = document.createElement('canvas');
  oc.width = oc.height = s;
  const o = oc.getContext('2d');
  o.font = `${s * 0.8}px ${EMOJI_FONT}`;
  o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText(e, s / 2, s / 2 + s * 0.05);
  return (spriteCache[e] = oc);
}
FRUITS.forEach(f => sprite(f.e));

// ---------- 사운드 (WebAudio로 간단히 합성) ----------
let AC = null;
function initAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) { AC = null; } }
function noise(dur, freq, gain, type = 'bandpass') {
  if (!AC) return;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function tone(f1, f2, dur, gain, type = 'sine') {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(t + dur);
}
const sfx = {
  slice() { noise(0.12, 2500 + Math.random() * 1500, 0.5); },
  bomb()  { noise(0.7, 300, 1.4, 'lowpass'); tone(160, 30, 0.6, 0.6, 'sawtooth'); },
  miss()  { tone(300, 120, 0.25, 0.25, 'triangle'); },
  combo() { [0, 0.08, 0.16].forEach((d, i) => setTimeout(() => tone(600 + i * 200, 900 + i * 200, 0.12, 0.2, 'square'), d * 1000)); },
  over()  { tone(400, 80, 0.9, 0.3, 'triangle'); }
};

// ---------- 게임 상태 ----------
let state = 'menu';
let score = 0, lives = 3, elapsed = 0;
let best = 0;
try { best = +localStorage.getItem('fruitSliceBest') || 0; } catch (e) {}

let objs = [];       // 날아다니는 과일/폭탄
let halves = [];     // 잘린 반쪽
let parts = [];      // 과즙/폭발 파티클
let splats = [];     // 배경 과즙 얼룩
let texts = [];      // 떠오르는 점수 텍스트
let trail = [];      // 칼 궤적
let pending = [];    // 발사 대기열
let spawnTimer = 1;
let shake = 0, flash = 0;
let combo = 0, lastSliceAt = 0, comboX = 0, comboY = 0;
let pointerDown = false, last = null;

const elScore = document.getElementById('score');
const elBest = document.getElementById('bestHud');
const elLives = document.getElementById('lives').children;
function updateHud() {
  elScore.textContent = score;
  elBest.textContent = '최고 ' + best;
  for (let i = 0; i < 3; i++) elLives[i].classList.toggle('lost', i < 3 - lives);
}
updateHud();

const G = () => H * 1.1;   // 중력 (화면 높이에 비례)
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- 발사 ----------
function launch(isBomb) {
  const r = Math.max(32, Math.min(W, H) * 0.06) * (isBomb ? 0.95 : rand(0.9, 1.15));
  const x = rand(W * 0.15, W * 0.85);
  const peak = rand(H * 0.45, H * 0.85);                 // 올라갈 높이
  const vy = -Math.sqrt(2 * G() * (peak + r));            // 그 높이에 도달할 초기 속도
  const tFlight = 2 * -vy / G();
  const targetX = rand(W * 0.25, W * 0.75);
  const vx = (targetX - x) / tFlight * rand(0.6, 1.2);
  const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
  objs.push({ x, y: H + r, vx, vy, r, rot: rand(0, 6.28), vr: rand(-3, 3), bomb: isBomb, f, dead: false });
}

function scheduleWave() {
  const lvl = Math.min(elapsed / 20, 4);                  // 20초마다 난이도 상승 (최대 4)
  const count = 1 + Math.floor(Math.random() * (1.5 + lvl));
  const bombChance = Math.min(0.12 + elapsed * 0.003, 0.3);
  const burst = Math.random() < 0.35;                     // 동시에 쏘기 vs 연달아 쏘기
  for (let i = 0; i < count; i++) {
    pending.push({ at: burst ? 0 : i * rand(0.15, 0.35), bomb: Math.random() < bombChance });
  }
  // 웨이브 전체가 폭탄이면 과일 하나는 보장
  if (pending.every(p => p.bomb)) pending[0].bomb = false;
  spawnTimer = Math.max(0.9, 2.2 - lvl * 0.3) + rand(-0.2, 0.3);
}

// ---------- 베기 판정 ----------
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  const qx = ax + t * dx, qy = ay + t * dy;
  return Math.hypot(px - qx, py - qy);
}

function checkSlice(a, b) {
  const speed = Math.hypot(b.x - a.x, b.y - a.y);
  if (speed < 3) return;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  for (const o of objs) {
    if (o.dead) continue;
    if (segDist(o.x, o.y, a.x, a.y, b.x, b.y) < o.r * 0.9) {
      o.dead = true;
      o.bomb ? hitBomb(o) : hitFruit(o, ang);
    }
  }
}

function hitFruit(o, ang) {
  score += 1;
  sfx.slice();
  // 반쪽 두 개: 칼 방향의 수직으로 벌어짐
  const nx = -Math.sin(ang), ny = Math.cos(ang), push = 140;
  for (const side of [-1, 1]) {
    halves.push({ x: o.x, y: o.y, vx: o.vx * 0.6 + nx * push * side, vy: o.vy * 0.4 + ny * push * side - 60,
      r: o.r, rot: o.rot, vr: o.vr + side * rand(2, 5), cut: ang, side, f: o.f, life: 3 });
  }
  // 과즙
  for (let i = 0; i < 22; i++) {
    const a = rand(0, 6.28), s = rand(80, 420);
    parts.push({ x: o.x, y: o.y, vx: Math.cos(a) * s + o.vx * 0.3, vy: Math.sin(a) * s + o.vy * 0.2,
      r: rand(2, 6), c: o.f.c, life: rand(0.4, 0.9), max: 0.9, g: 1 });
  }
  splats.push({ x: o.x, y: o.y, r: o.r * rand(1.1, 1.6), c: o.f.c, life: 4, seed: Math.random() * 1000 });
  if (splats.length > 25) splats.shift();
  texts.push({ x: o.x, y: o.y - o.r, t: '+1', c: '#fff', s: 26, life: 0.8, max: 0.8 });

  // 콤보 집계
  const now = performance.now();
  combo = (now - lastSliceAt < 260) ? combo + 1 : 1;
  lastSliceAt = now; comboX = o.x; comboY = o.y;
  updateHud();
}

function hitBomb(o) {
  score -= 10;
  sfx.bomb();
  shake = 0.5; flash = 1;
  for (let i = 0; i < 50; i++) {
    const a = rand(0, 6.28), s = rand(150, 700);
    parts.push({ x: o.x, y: o.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      r: rand(3, 9), c: Math.random() < 0.5 ? '#ffb300' : (Math.random() < 0.5 ? '#ff4d00' : '#555'),
      life: rand(0.5, 1.1), max: 1.1, g: 0.3 });
  }
  texts.push({ x: o.x, y: o.y, t: '−10', c: '#ff4b3e', s: 56, life: 1.2, max: 1.2 });
  combo = 0;
  updateHud();
}

// ---------- 입력 ----------
function pos(e) { return { x: e.clientX, y: e.clientY, t: performance.now() }; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  pointerDown = true; last = pos(e); trail.push(last);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pointerDown || state !== 'play') return;
  // 빠른 움직임도 놓치지 않도록 브라우저가 합친 이벤트까지 모두 사용
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pos(ev);
    checkSlice(last, p);
    trail.push(p); last = p;
  }
});
const up = () => { pointerDown = false; last = null; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

// ---------- 시작/종료 ----------
const menu = document.getElementById('menu'), over = document.getElementById('over');
function start() {
  initAudio();
  state = 'play';
  score = 0; lives = 3; elapsed = 0;
  objs = []; halves = []; parts = []; texts = []; pending = []; splats = [];
  spawnTimer = 0.6; combo = 0;
  menu.classList.add('hidden'); over.classList.add('hidden');
  updateHud();
}
function gameOver() {
  state = 'over';
  sfx.over();
  pointerDown = false;
  const nb = score > best;
  if (nb) { best = score; try { localStorage.setItem('fruitSliceBest', best); } catch (e) {} }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('newBest').textContent = nb ? '🏆 최고 기록!' : '최고 기록 ' + best;
  setTimeout(() => over.classList.remove('hidden'), 700);
  updateHud();
}
document.getElementById('startBtn').onclick = start;
document.getElementById('againBtn').onclick = start;

// ---------- 업데이트 ----------
function update(dt) {
  const g = G();
  if (state === 'play') {
    elapsed += dt;
    spawnTimer -= dt;
    if (spawnTimer <= 0) scheduleWave();
    for (const p of pending) p.at -= dt;
    pending = pending.filter(p => { if (p.at <= 0) { launch(p.bomb); return false; } return true; });

    // 콤보 마무리 판정
    if (combo > 0 && performance.now() - lastSliceAt > 260) {
      if (combo >= 3) {
        score += combo;
        sfx.combo();
        texts.push({ x: comboX, y: comboY - 50, t: `${combo} 콤보! +${combo}`, c: '#ffd84a', s: 40, life: 1.3, max: 1.3 });
        updateHud();
      }
      combo = 0;
    }
  }

  for (const o of objs) {
    o.vy += g * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    if (!o.dead && o.vy > 0 && o.y > H + o.r + 10) {
      o.dead = true;
      if (!o.bomb && state === 'play') {
        lives--; sfx.miss();
        texts.push({ x: Math.max(30, Math.min(W - 30, o.x)), y: H - 40, t: '✕', c: '#ff3b30', s: 48, life: 1, max: 1 });
        updateHud();
        if (lives <= 0) gameOver();
      }
    }
  }
  objs = objs.filter(o => !o.dead);

  for (const h of halves) { h.vy += g * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt; h.life -= dt; }
  halves = halves.filter(h => h.life > 0 && h.y < H + h.r * 2);

  for (const p of parts) { p.vy += g * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  for (const s of splats) s.life -= dt;
  splats = splats.filter(s => s.life > 0);

  for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);

  const now = performance.now();
  trail = trail.filter(p => now - p.t < 140);

  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt * 2.5);
}

// ---------- 그리기 ----------
function drawBg() {
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#5b3a22'); gr.addColorStop(1, '#2e1b0f');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // 나무 판자 줄
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 3;
  const plank = Math.max(90, W / 8);
  for (let x = plank; x < W; x += plank) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,220,170,.04)'; ctx.lineWidth = 1;
  for (let y = 20; y < H; y += 37) { ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(W * .3, y + 8, W * .6, y - 8, W, y + 4); ctx.stroke(); }
}

function drawSplats() {
  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.life / 2) * 0.45;
    ctx.fillStyle = s.c;
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const rr = s.r * (0.7 + 0.3 * Math.sin(s.seed + i * 2.3));
      i ? ctx.lineTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr) : ctx.moveTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFruit(o) {
  const img = sprite(o.f.e), s = o.r * 2.4;
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function drawBomb(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
  const r = o.r;
  // 몸통
  const gr = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r);
  gr.addColorStop(0, '#666'); gr.addColorStop(1, '#111');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r - 1.5, 0, 6.28); ctx.stroke();
  // 꼭지
  ctx.fillStyle = '#333'; ctx.fillRect(-r * .22, -r * 1.12, r * .44, r * .25);
  // 심지
  ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(0, -r * 1.1); ctx.quadraticCurveTo(r * .3, -r * 1.45, r * .15, -r * 1.6); ctx.stroke();
  // 불꽃 (깜빡임)
  const fl = 0.6 + Math.random() * 0.6;
  ctx.fillStyle = '#ffeb3b'; ctx.shadowColor = '#ff9800'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(r * .15, -r * 1.62, r * .16 * fl, 0, 6.28); ctx.fill();
  ctx.shadowBlur = 0;
  // 해골 표시
  ctx.font = `${r * .9}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = .85; ctx.fillText('☠️', 0, r * .08); ctx.globalAlpha = 1;
  ctx.restore();
  // 경고 링
  ctx.strokeStyle = `rgba(255,59,48,${0.25 + 0.2 * Math.sin(performance.now() / 90)})`;
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.35, 0, 6.28); ctx.stroke();
}

function drawHalf(h) {
  const img = sprite(h.f.e), s = h.r * 2.4;
  ctx.save();
  ctx.globalAlpha = Math.min(1, h.life);
  ctx.translate(h.x, h.y);
  const spin = h.rot - (h.rot0 ?? (h.rot0 = h.rot));
  ctx.rotate(h.cut + spin);
  // 칼이 지나간 선을 기준으로 한쪽만 보이게 자르기
  ctx.beginPath();
  ctx.rect(-s, h.side < 0 ? -s : 0, s * 2, s);
  ctx.clip();
  ctx.rotate(-h.cut + h.rot0);
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.restore();
  // 단면 (과육 색 선)
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.cut + spin);
  ctx.strokeStyle = h.f.c; ctx.globalAlpha = Math.min(1, h.life) * 0.9; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-h.r * 0.9, 0); ctx.lineTo(h.r * 0.9, 0); ctx.stroke();
  ctx.restore();
}

function drawTrail() {
  if (trail.length < 2) return;
  const now = performance.now();
  ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    const k = 1 - (now - b.t) / 140;      // 최신일수록 1
    if (k <= 0) continue;
    ctx.strokeStyle = `rgba(160,220,255,${k * 0.5})`; ctx.lineWidth = 14 * k;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 6 * k;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * 18 * shake, rand(-1, 1) * 18 * shake);
  drawBg();
  drawSplats();
  for (const h of halves) drawHalf(h);
  for (const o of objs) o.bomb ? drawBomb(o) : drawFruit(o);
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawTrail();
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 1.5);
    ctx.font = `${t.s}px 'Black Han Sans', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(t.t, t.x, t.y);
    ctx.fillStyle = t.c; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,220,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 메인 루프 ----------
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - prev) / 1000);
  prev = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
